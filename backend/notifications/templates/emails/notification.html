<!doctype html>
<html lang="en">
<body style="margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#1f2937">
  <div style="max-width:600px;margin:32px auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden">
    <div style="background:#4f46e5;color:#fff;padding:22px 28px;font-size:20px;font-weight:700">CampusConnect</div>
    <div style="padding:28px">
      <p style="font-size:13px;color:#4f46e5;font-weight:700;text-transform:uppercase">{{ notification.get_category_display }}</p>
      <h1 style="font-size:22px;margin:0 0 14px">{{ notification.title }}</h1>
      <p style="line-height:1.6">{{ notification.message }}</p>
      {% if action_url %}<p style="margin:26px 0"><a href="{{ action_url }}" style="background:#4f46e5;color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:700">Open CampusConnect</a></p>{% endif %}
      <p style="font-size:13px;color:#6b7280">You can change email preferences from your CampusConnect notification centre.</p>
    </div>
  </div>
</body>
</html>
